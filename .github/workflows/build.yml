name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 编译
        run: dotnet build src/TimeCapsule/TimeCapsule.csproj -c Release --nologo

      - name: 内核自检（建库 / 加密 / 快照 / 恢复 / 篡改检测）
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'selftest'
          New-Item -ItemType Directory -Force $work | Out-Null
          $exe = '.\src\TimeCapsule\bin\Release\net8.0-windows\TimeCapsule.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest', $work -Wait -PassThru -NoNewWindow
          Write-Host "退出码 = $($p.ExitCode)"
          $log = Join-Path $work 'reports\selftest-latest.log'
          if (Test-Path $log) {
              Get-Content $log -Encoding UTF8 -Tail 3
              $fails = Select-String -Path $log -Pattern '^FAIL' -Encoding UTF8
              if ($fails) { $fails | ForEach-Object { Write-Host $_.Line }; throw "自检有 $($fails.Count) 项失败" }
          }
          if ($p.ExitCode -ne 0) { throw "自检退出码 $($p.ExitCode)，详见 $log" }

      - name: 自包含发布（目标机不用装 .NET）
        run: >
          dotnet publish src/TimeCapsule/TimeCapsule.csproj -c Release -r win-x64
          --self-contained true -p:PublishReadyToRun=false -o out --nologo

      - name: 打包
        shell: pwsh
        run: Compress-Archive -Path out\* -DestinationPath TimeCapsule-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TimeCapsule-win-x64
          path: TimeCapsule-win-x64.zip

      - name: 发布 Release（只在打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TimeCapsule-win-x64.zip
          body: |
            自包含单文件包，解压双击 `TimeCapsule.exe` 即可，无需安装 .NET。
